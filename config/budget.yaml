# =====================================================================
#  VERBINDLICHE BUDGETKONTROLLE – STORYHOUSE ORIGINALS
#  Änderungen an dieser Datei nur per Pull Request mit Review.
# =====================================================================

# Hauptschalter. Solange false, verweigert die Pipeline JEDEN
# kostenpflichtigen API-Aufruf – unabhängig von Workflow-Eingaben.
# Freigegeben per PR durch die Produktion (14.11.2026) – NUR im Rahmen von paid_scope.
# 15.11.2026 wieder auf false: Vorgabe „Bezahlte Filmproduktion bleibt deaktiviert, bis ich ausdrücklich
# zustimme“. Für den nächsten S01-Test per PR wieder auf true setzen (paid_scope bleibt test/S01).
# 15.11.2026 (zweiter PR): true NUR für das Testvideo „ETAGE 0 – Der verbotene Knopf“ – ausdrücklich
# freigegeben mit höchstens 10 € Gesamtverbrauch (paid_scope.episodes + paid_scope.budget_eur).
# Nach der Abnahme wieder auf false setzen.
# 15.11.2026 (dritter PR): wieder false. Das Testvideo ist gerendert (Lauf 43724968662) und wurde NICHT
# abgenommen. Für die Serienfassung (episodes/etage-0/s01e01-der-verbotene-knopf) gilt: zuerst Drehbuch,
# Storyboard und kostenlose Vorschau freigeben – erst dann per eigenem PR Umfang und Budget neu festlegen.
paid_rendering_enabled: false

# Freigabeumfang: Nur diese Profile/Szenen/Tonquellen dürfen bezahlt gerendert
# werden. Alles andere bricht im Preflight ab, BEVOR Geld fließt – egal was im
# Workflow eingegeben wird. Erweitern (z. B. scenes: all, profiles: [test, final])
# nur per eigenem PR nach Abnahme des vorherigen Renders.
paid_scope:
  # final = gen4.5 + gen4_image (Veröffentlichungsqualität). Erlaubt, weil unten
  # elevenlabs.require_commercial_license: true gilt (bezahlter Tarif wird vor dem Lauf geprüft).
  profiles: [final]
  scenes: [S01, S02, S03, S04, S05]
  audio_providers: [elevenlabs]
  # Nur diese Episode(n) dürfen bezahlt laufen – alle anderen brechen im Preflight ab.
  episodes: [etage-0-der-verbotene-knopf]
  # Obergrenze für ALLE bezahlten Läufe dieser Episode(n) zusammen (verbucht + reserviert + neuer Lauf
  # inkl. 25 % Puffer). Ein zweiter Lauf, der darüber käme, wird verweigert.
  budget_eur: 10.00

currency: EUR

# Absolute Obergrenze über die gesamte Produktion (alle Läufe zusammen).
total_budget_eur: 200.00

# Obergrenze pro einzelnem Workflow-Lauf.
max_per_run_eur: 25.00

# Sicherheitsaufschlag auf jede Kostenschätzung (0.25 = +25 %).
safety_margin: 0.25

# Konservativer Wechselkurs: Runway rechnet in USD-Credits (1 Credit = 0.01 USD).
# 1.00 überschätzt die Kosten bewusst (realer Kurs liegt darunter).
eur_per_usd: 1.00

# Umsatzsteuer auf den Credit-Kauf (Runway: "sales tax may apply").
# Wird auf jede Schätzung aufgeschlagen. Mindestwert 0.19.
vat_rate: 0.19

# Warnschwelle (Anteil des Gesamtbudgets), ab der der Workflow laut warnt.
warn_at_fraction: 0.75

# Ledger (Kostenbuch). Wird im Workflow auf einem eigenen Branch gespeichert,
# damit jeder Lauf den Stand aller vorherigen Läufe kennt.
ledger_branch: budget-ledger
ledger_file: ledger.json

# Bestätigungsphrase, die für einen kostenpflichtigen Lauf im Workflow
# exakt eingegeben werden muss.
approval_phrase: "ICH GEBE DIESEN RENDER FREI"

# ---------------------------------------------------------------------
# ElevenLabs (Stimmen, Soundeffekte, Musik)
# ---------------------------------------------------------------------
elevenlabs:
  # Der Free-Tarif enthält KEINE kommerzielle Lizenz (Namensnennung nötig,
  # keine Monetarisierung). Solange true, verweigert der Preflight bezahlte
  # Läufe auf einem Free-Konto.
  # Auf false gesetzt per PR (14.11.2026): Free-Tarif NUR für einen privaten,
  # nicht kommerziellen Testfilm. Der Code erzwingt dann zusätzlich:
  #   - paid_scope.profiles darf nur "test" enthalten (kein final)
  #   - jede Ausgabedatei wird als "PRIVATER TEST – nicht kommerziell, nicht zur
  #     Veröffentlichung" gekennzeichnet (Dateiname, MP4-Metadaten, manifest.json)
  #   - Ergebnisse weiterhin nur verschlüsselt als Workflow-Artefakt, nie veröffentlicht
  # Für eine Veröffentlichung: Material mit bezahltem Tarif NEU generieren und
  # diesen Wert wieder auf true setzen.
  # 15.11.2026: wieder true – ETAGE 0 wird für die kommerzielle Veröffentlichung produziert
  # (ElevenLabs Starter). Der Preflight und die Prüfung direkt vor dem Render brechen ab, wenn das
  # Konto (noch) im Free-Tarif ist. Damit entsteht KEIN als „privater Test“ markiertes Material mehr;
  # alle Stimmen und Soundeffekte werden in diesem Lauf unter dem bezahlten Tarif neu erzeugt.
  require_commercial_license: true
  # Musik wird erst generiert, wenn die Produktion die Eleven-Music-Bedingungen
  # (elevenlabs.io/music-terms) für diesen Verwendungszweck geprüft hat und das
  # hier per PR bestätigt. Bis dahin: Drone-Musikbett (Soundeffekt) als Ersatz.
  music_license_confirmed: false
  # Nicht konfigurierbar (im Code fest): Nutzungsbasierte Abrechnung/Overage
  # muss im ElevenLabs-Konto AUS sein, sonst bricht der Preflight ab.

# ---------------------------------------------------------------------
# Zusätzliche Anbieter – nur VORBEREITET (storyhouse/zusatz_anbieter.py).
# Solange false, ruft der Code diese Anbieter nie auf – auch nicht mit
# gesetztem Secret. Freischalten nur per eigenem PR nach deiner Zustimmung.
# ---------------------------------------------------------------------
zusatz_anbieter:
  minimax: false   # Hailuo-02 Video        – Secret MINIMAX_API_KEY
  hedra: false     # Character-3 Lippensync – Secret HEDRA_API_KEY (Endpunkte zusätzlich ungeprüft)
  gemini: false    # Nano Banana Bilder     – Secret GEMINI_API_KEY
