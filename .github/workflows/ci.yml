# Kostenlose Prüfungen für Pull Requests: Tests, Validierung, Kostenschätzung.
# Kein API-Schlüssel, keine API-Aufrufe, keine Veröffentlichung.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core openssl >/dev/null
          pip install -q -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Episode validieren
        run: python -m storyhouse validate
      - name: Episode ETAGE 0 prüfen und schätzen (0 €)
        run: |
          python -m storyhouse validate --episode episodes/etage-0/ep01-der-verbotene-knopf
          python -m storyhouse estimate --episode episodes/etage-0/ep01-der-verbotene-knopf --profile test
      - name: Dry-Run (Vorschau, 0 €, kein Secret, kein API-Aufruf)
        run: python -m storyhouse dry-run --preview --out output/ci-dry-run
      - name: Kostenschätzung (Test & Final)
        run: |
          python -m storyhouse estimate --profile test
          python -m storyhouse estimate --profile final
      # Serienfassung ETAGE 0 – S01E01: Prüfen, Storyboard aktuell?, Kosten, kostenlose Vorschau (Animatic).
      - name: ETAGE 0 S01E01 prüfen, Storyboard abgleichen, Kosten schätzen (0 €)
        run: |
          E=episodes/etage-0/s01e01-der-verbotene-knopf
          python -m storyhouse validate --episode "$E"
          python -m storyhouse storyboard --episode "$E" | diff - "$E/STORYBOARD.md"
          python -m storyhouse estimate --episode "$E" --profile final --stills-only
          python -m storyhouse estimate --episode "$E" --profile final
      - name: ETAGE 0 S01E01 – Vorschau (Animatic, 0 €, kein Secret, kein API-Aufruf)
        run: |
          python -m storyhouse dry-run --preview --episode episodes/etage-0/s01e01-der-verbotene-knopf \
            --profile final --out output/etage0-vorschau
      # Enthält nur Inhalte, die ohnehin im Repo stehen (Texttafeln, Platzhaltertöne).
      - uses: actions/upload-artifact@v4
        with:
          name: etage0-s01e01-vorschau
          path: |
            output/etage0-vorschau/*_dryrun.mp4
            output/etage0-vorschau/*.srt
            output/etage0-vorschau/estimate.md
          retention-days: 14
