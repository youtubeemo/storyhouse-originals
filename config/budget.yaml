# =====================================================================
#  VERBINDLICHE BUDGETKONTROLLE – STORYHOUSE ORIGINALS
#  Änderungen an dieser Datei nur per Pull Request mit Review.
# =====================================================================

# Hauptschalter. Solange false, verweigert die Pipeline JEDEN
# kostenpflichtigen API-Aufruf – unabhängig von Workflow-Eingaben.
# Freigegeben per PR durch die Produktion (14.11.2026) – NUR im Rahmen von paid_scope.
paid_rendering_enabled: true

# Freigabeumfang: Nur diese Profile/Szenen/Tonquellen dürfen bezahlt gerendert
# werden. Alles andere bricht im Preflight ab, BEVOR Geld fließt – egal was im
# Workflow eingegeben wird. Erweitern (z. B. scenes: all, profiles: [test, final])
# nur per eigenem PR nach Abnahme des vorherigen Renders.
paid_scope:
  profiles: [test]
  scenes: [S01]
  audio_providers: [elevenlabs]

currency: EUR

# Absolute Obergrenze über die gesamte Produktion (alle Läufe zusammen).
total_budget_eur: 200.00

# Obergrenze pro einzelnem Workflow-Lauf.
max_per_run_eur: 25.00

# Sicherheitsaufschlag auf jede Kostenschätzung (0.25 = +25 %).
safety_margin: 0.25

# Konservativer Wechselkurs: Runway rechnet in USD-Credits (1 Credit = 0.01 USD).
# 1.00 überschätzt die Kosten bewusst (realer Kurs liegt darunter).
eur_per_usd: 1.00

# Umsatzsteuer auf den Credit-Kauf (Runway: "sales tax may apply").
# Wird auf jede Schätzung aufgeschlagen. Mindestwert 0.19.
vat_rate: 0.19

# Warnschwelle (Anteil des Gesamtbudgets), ab der der Workflow laut warnt.
warn_at_fraction: 0.75

# Ledger (Kostenbuch). Wird im Workflow auf einem eigenen Branch gespeichert,
# damit jeder Lauf den Stand aller vorherigen Läufe kennt.
ledger_branch: budget-ledger
ledger_file: ledger.json

# Bestätigungsphrase, die für einen kostenpflichtigen Lauf im Workflow
# exakt eingegeben werden muss.
approval_phrase: "ICH GEBE DIESEN RENDER FREI"

# ---------------------------------------------------------------------
# ElevenLabs (Stimmen, Soundeffekte, Musik)
# ---------------------------------------------------------------------
elevenlabs:
  # Der Free-Tarif enthält KEINE kommerzielle Lizenz (Namensnennung nötig,
  # keine Monetarisierung). Solange true, verweigert der Preflight bezahlte
  # Läufe auf einem Free-Konto. Nur für rein private Tests per PR auf false.
  require_commercial_license: true
  # Musik wird erst generiert, wenn die Produktion die Eleven-Music-Bedingungen
  # (elevenlabs.io/music-terms) für diesen Verwendungszweck geprüft hat und das
  # hier per PR bestätigt. Bis dahin: Drone-Musikbett (Soundeffekt) als Ersatz.
  music_license_confirmed: false
  # Nicht konfigurierbar (im Code fest): Nutzungsbasierte Abrechnung/Overage
  # muss im ElevenLabs-Konto AUS sein, sonst bricht der Preflight ab.
