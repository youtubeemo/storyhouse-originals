# =====================================================================
#  Film produzieren – NUR MANUELL (Actions → "Film produzieren" → Run workflow)
#
#  Bild: Runway · Ton: ElevenLabs (Dialoge, Soundeffekte, optional Musik) ·
#  Schnitt/Sync/Mischung/Untertitel/Outro: FFmpeg. Ergebnis: vertikales MP4.
#
#  mode = dry-run      kostenlos: Platzhalterbilder + Platzhalterton, echter
#                      Schnitt/Mischung/Untertitel/Outro/Loop; kein Secret, keine API.
#  mode = paid-render  kostenpflichtig: nur wenn ALLE Sperren offen sind:
#                      1) Lauf auf main gestartet
#                      2) config/budget.yaml paid_rendering_enabled: true (per PR)
#                      3) Bestätigungsphrase exakt eingegeben
#                      4) Umgebung "paid-render" freigegeben (Required Reviewer,
#                         Deployment-Branch nur main)
#                      5) Preise geprüft und < 45 Tage alt
#                      6) Budget-Reservierung passt in Lauf- und Gesamtbudget,
#                         keine offene Reservierung, Runway-Guthaben reicht
#                      7) ElevenLabs-Konto: Kontingent reicht, kommerzielle Lizenz,
#                         nutzungsbasierte Abrechnung (Overage) ist AUS, Stimme vorhanden
#  Der Workflow kauft nichts: kein Abo, kein Guthaben, keine Nachbuchung.
#                      8) Freigabe nachweisbar: GitHub-API bestätigt, dass eine
#                         berechtigte Person DIESEN Lauf für paid-render freigegeben
#                         hat (in privaten Repos ohne Enterprise gibt es das nicht
#                         -> bezahlter Render wird verweigert)
#  Es wird NICHTS veröffentlicht. Bezahlte Ergebnisse werden IMMER verschlüsselt
#  hochgeladen. Zusätzlich unverschlüsselt (zum direkten Abspielen) NUR, wenn die
#  GitHub-API unmittelbar vor dem Upload bestätigt, dass das Repo PRIVAT ist.
# =====================================================================
name: Film produzieren

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (kostenlos) oder paid-render (kostenpflichtig, Freigabe nötig)"
        type: choice
        options: [dry-run, paid-render]
        default: dry-run
      episode:
        description: "Welche Episode (bezahlt nur, wenn in paid_scope.episodes freigegeben)"
        type: choice
        options:
          - episodes/the-other-side/ep01-the-reflection
          - episodes/etage-0/ep01-der-verbotene-knopf
          - episodes/etage-0/s01e01-der-verbotene-knopf
        default: episodes/the-other-side/ep01-the-reflection
      profile:
        description: "test = günstige Modelle, final = Endqualität"
        type: choice
        options: [test, final]
        default: test
      scenes:
        description: "S01 | all (ganzer Film) | S01,S03 | S02-S04 – bezahlt nur im Umfang von paid_scope"
        type: string
        default: S01
      preview:
        description: "Dry-Run in kleiner Auflösung (schneller)"
        type: boolean
        default: false
      stills_only:
        description: "Bild-Storyboard-Stufe: Referenzen, Keyframes und Ton, aber kein Video (günstig)"
        type: boolean
        default: false
      approval:
        description: "Nur für paid-render: exakte Bestätigungsphrase aus config/budget.yaml"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  dry-run:
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ inputs.profile }}
      EPISODE: ${{ inputs.episode }}
      SCENES: ${{ inputs.scenes }}
      PREVIEW: ${{ inputs.preview }}
      STILLS: ${{ inputs.stills_only && '--stills-only' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter >/dev/null || \
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Dry-Run rendern (0 €)
        run: |
          extra=""
          if [ "$PREVIEW" = "true" ]; then extra="--preview"; fi
          python -m storyhouse dry-run --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --out output/dry-run $extra
      - name: Qualitätsprüfung Dry-Run (0 €)
        run: |
          set -o pipefail
          profil=shorts
          if [ "$PREVIEW" = "true" ]; then profil=vorschau; fi   # 360×640, 12 fps
          python scripts/videoqc.py output/dry-run/*.mp4 --profil "$profil" \
            --srt "$(ls output/dry-run/*.srt | head -n 1)" --json output/dry-run/qualitaet.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Enthält nur Inhalte, die ohnehin im (öffentlichen) Repo stehen.
      - uses: actions/upload-artifact@v4
        with:
          name: dryrun-${{ github.run_id }}
          path: |
            output/dry-run/*.mp4
            output/dry-run/*.srt
            output/dry-run/*.md
            output/dry-run/*.json
          retention-days: 7

  # ---------------------------------------------------------------
  paid-render:
    if: ${{ inputs.mode == 'paid-render' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Settings → Environments → paid-render:
    #   Required reviewers = Produktion, Deployment branches = nur main,
    #   Secrets RUNWAYML_API_SECRET + ELEVENLABS_API_KEY + ARTIFACT_PASSPHRASE
    #   (nur hier, nicht als Repo-Secret)
    environment:
      name: paid-render
    # Nie zwei bezahlte Läufe gleichzeitig (Ledger-Konsistenz).
    concurrency:
      group: paid-render-budget
      cancel-in-progress: false
    permissions:
      contents: write   # nur für den Branch "budget-ledger"
      actions: read     # Freigabe-Historie dieses Laufs lesen
    env:
      PROFILE: ${{ inputs.profile }}
      EPISODE: ${{ inputs.episode }}
      SCENES: ${{ inputs.scenes }}
      STILLS: ${{ inputs.stills_only && '--stills-only' || '' }}
      STORYHOUSE_APPROVAL: ${{ inputs.approval }}
      STORYHOUSE_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ersatz-Sicherung, falls Required Reviewers nicht greifen (z. B. privates Repo
      # ohne Enterprise): ohne nachweisliche Freigabe kein bezahlter Render.
      - name: Freigabe nachweisen (Required Reviewers)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m storyhouse.github_guard approval --environment paid-render
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-inter >/dev/null || \
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Generalprobe (Dry-Run, 0 €)
        run: python -m storyhouse dry-run --preview --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --out output/rehearsal
      - name: Ledger holen
        run: bash scripts/ledger.sh pull
      - name: Budgetstand
        run: python -m storyhouse budget-status --ledger .ledger/ledger.json
      # Zwischenspeicher früherer Läufe (verschlüsselt): Was schon bezahlt und unverändert ist, wird weder
      # reserviert noch neu erzeugt. Lauf 43758293707 brach bei KF_S20 ab und hatte nichts gesichert –
      # 3,58 € an Bildern und Ton waren verloren. Seitdem wird der Stand nach JEDEM Lauf gesichert.
      - name: Zwischenspeicher holen
        uses: actions/cache/restore@v4
        with:
          path: output/szenen-cache.tar.enc
          key: szenen-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: szenen-cache-
      - name: Zwischenspeicher entschlüsseln
        run: |
          bash scripts/szenen_cache.sh unpack output/szenen-cache.tar.enc output/szenen-cache
          rm -f output/szenen-cache.tar.enc
      - name: Preflight (Freigabe, Preise, Budget, Guthaben)
        run: python -m storyhouse preflight --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --ledger .ledger/ledger.json --cache output/szenen-cache
      - name: Budget reservieren und sichern (vor jeder Ausgabe)
        run: |
          python -m storyhouse reserve --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --ledger .ledger/ledger.json --run-id "$STORYHOUSE_RUN_ID" --cache output/szenen-cache
          bash scripts/ledger.sh push "reserve $STORYHOUSE_RUN_ID"
      - name: Rendern (kostenpflichtig)
        run: python -m storyhouse render --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --ledger .ledger/ledger.json --run-id "$STORYHOUSE_RUN_ID" --out output/render --cache output/szenen-cache
      # Direkt nach dem Render und AUCH bei Abbruch: alles bisher Bezahlte verschlüsselt sichern.
      - name: Zwischenspeicher verschlüsseln
        if: ${{ always() }}
        run: |
          if [ -d output/szenen-cache ]; then
            bash scripts/szenen_cache.sh pack output/szenen-cache output/szenen-cache.tar.enc
          fi
      - name: Zwischenspeicher sichern
        if: ${{ always() && hashFiles('output/szenen-cache.tar.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: output/szenen-cache.tar.enc
          key: szenen-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # Prüft das bezahlte Ergebnis, blockiert aber nichts: das Geld ist ausgegeben, das Ergebnis wird
      # in jedem Fall verschlüsselt gesichert. Bericht nur auf der Laufseite, keine Videodaten.
      - name: Qualitätsprüfung (Länge, 9:16, Ton, Lautheit, Untertitel)
        id: qc
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p output/qc
          python scripts/videoqc.py output/render/*.mp4 --profil shorts \
            --srt "$(ls output/render/*.srt | head -n 1)" --json output/qc/qualitaet.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Kosten verbuchen
        if: ${{ always() }}
        run: |
          if [ -f .ledger/ledger.json ]; then
            python -m storyhouse finalize --episode "$EPISODE" --profile "$PROFILE" --scenes "$SCENES" $STILLS --ledger .ledger/ledger.json --run-id "$STORYHOUSE_RUN_ID" --out output/render
            bash scripts/ledger.sh push "finalize $STORYHOUSE_RUN_ID"
          fi
      - name: Ergebnisse verschlüsseln
        if: ${{ always() }}
        run: bash scripts/encrypt_outputs.sh output/render output/encrypted
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: render-${{ github.run_id }}-encrypted
          path: output/encrypted/
          retention-days: 14
          if-no-files-found: ignore
      # Unverschlüsselt NUR bei bestätigt privatem Repo (Prüfung direkt vor dem Upload).
      - name: Sichtbarkeit prüfen (privat?)
        id: visibility
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m storyhouse.github_guard visibility
      - name: Film unverschlüsselt hochladen (nur privates Repo)
        if: ${{ always() && steps.visibility.outputs.private == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ github.run_id }}-mp4
          path: |
            output/render/*.mp4
            output/render/*.srt
            output/render/LIZENZ_*.txt
          retention-days: 7
          if-no-files-found: ignore
      # Ganz zum Schluss, NACHDEM Kosten verbucht und Ergebnisse gesichert sind: Ein Film, der die technische
      # Prüfung nicht besteht, darf nicht als grüner „erfolgreicher“ Lauf erscheinen (Lauf 43724968662 war
      # grün, obwohl der True Peak über dem Grenzwert lag). Die Prüfung ersetzt NICHT die Abnahme durch
      # Ansehen und Anhören – siehe docs/PIPELINE_ANALYSE.md, „Abnahme“.
      - name: Ergebnis der Qualitätsprüfung
        if: ${{ always() && steps.qc.outcome == 'failure' }}
        run: |
          echo "::error::Technische Qualitätsprüfung nicht bestanden – Bericht siehe Zusammenfassung des Laufs."
          exit 1
