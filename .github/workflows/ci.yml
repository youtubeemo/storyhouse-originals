# Kostenlose Prüfungen für Pull Requests: Tests, Validierung, Kostenschätzung.
# Kein API-Schlüssel, keine API-Aufrufe, keine Veröffentlichung.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Episode validieren
        run: python -m storyhouse validate
      - name: Kostenschätzung (Test & Final)
        run: |
          python -m storyhouse estimate --profile test
          python -m storyhouse estimate --profile final
